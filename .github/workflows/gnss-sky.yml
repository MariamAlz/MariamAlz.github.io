name: GNSS sky

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: gnss-sky

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/gnss_sky.py
      - name: Commit if changed
        run: |
          git diff --quiet assets/gnss.json 2>/dev/null && git ls-files --error-unmatch assets/gnss.json >/dev/null 2>&1 && exit 0
          git config user.name "gnss-sky bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/gnss.json
          git commit -m "Update GNSS sky"
          git pull --rebase origin main
          git push
